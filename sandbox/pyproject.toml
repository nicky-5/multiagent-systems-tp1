# The Python environment of the analyst's sandbox (see services/sandbox.py).
#
# Only what generated code needs is installed here; the app's own packages (LangChain,
# OpenAI, Pinecone, Streamlit, ...) are not visible inside the sandbox. Set it up with:
#     uv sync --project sandbox
[project]
name = "sandbox-env"
version = "0"
description = "Packages available to the analyst's generated code inside the sandbox"
requires-python = ">=3.14"
# What generated code may import (besides the standard library). The code-generation
# prompt lists exactly these, via services.sandbox.available_packages().
dependencies = [
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
]

[dependency-groups]
# Used by the sandbox launcher itself, not by generated code
launcher = ["pyseccomp>=0.1.2"]

[tool.uv]
package = false
default-groups = ["launcher"]  # `uv sync` installs it too
